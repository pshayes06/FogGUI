services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: foggui
      POSTGRES_USER: foggui
      POSTGRES_PASSWORD: foggui
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foggui"]
      interval: 5s
      retries: 5

  web:
    build: .
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://foggui:foggui@db:5432/foggui
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
