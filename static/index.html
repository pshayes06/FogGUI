<!DOCTYPE html>
<html>
<head>
    <title>FogGUI</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    <div class="top-bar">
        <div class="proj-description">
            <h1>FogGUI</h1>
            <p>An application to assist UAV field work</p>
        </div>
        <div class="running-details">
            <p>Uptime: <span id = "uptime"></span></p>
        </div>
    </div>
    <div class="altitude-charts">
        <canvas id="tempxalt"></canvas>
        <canvas id="relhumxalt"></canvas>
        <canvas id="pressxalt"></canvas>
    </div>
</body>
</html>
