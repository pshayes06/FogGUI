<!DOCTYPE html>
<html lang="en">
<head>
    <title>FogGUI - Flight</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav>
        <a href="." class="logo">FogGUI</a>
    </nav>

    <div class="top-bar">
        <h1 id="flightLabel"></h1>
        <div>
            <input type="text" id="editLabel" placeholder="Rename flight">
            <button onclick="saveLabel()">Save</button>
        </div>
    </div>

    <div class="filter-section">
        <label>Min altitude (m): <input type="number" id="minAlt"></label>
        <label>Max altitude (m): <input type="number" id="maxAlt"></label>
        <button onclick="loadCharts()">Apply</button>
    </div>

    <div class="charts-wrapper">
        <div class="scrubber-section">
            <span id="scrubberLabel">Time: --</span>
            <input type="range" id="scrubber" min="0" max="100" value="100" orient="vertical" style="writing-mode:vertical-lr; direction:rtl; flex:1;">
        </div>

        <div class="altitude-charts">
            <canvas id="detail-temp"></canvas>
            <canvas id="detail-hum"></canvas>
            <canvas id="detail-press"></canvas>
        </div>
    </div>

    <script src="js/flight.js"></script>
</body>
</html>
